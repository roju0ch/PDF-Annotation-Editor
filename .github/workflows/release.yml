name: Test release pipeline
on:
  pull_request:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      signed:
        description: 'Use configured signing secrets for an artifact-only rehearsal'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: test-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: version
        run: node scripts/release/validate.mjs
  checks:
    # PRs already run ci.yml directly. Tags and manual rehearsals run the same suite here.
    if: github.event_name != 'pull_request'
    needs: validate
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    with:
      sign_windows: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_WINDOWS == 'true' }}
      sign_macos: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_MACOS == 'true' }}
    secrets:
      WINDOWS_CERTIFICATE_BASE64: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_WINDOWS == 'true' && secrets.WINDOWS_CERTIFICATE_BASE64 || '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_WINDOWS == 'true' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
      APPLE_CERTIFICATE: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_MACOS == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_API_ISSUER: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_MACOS == 'true' && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_MACOS == 'true' && secrets.APPLE_API_KEY || '' }}
      APPLE_API_KEY_BASE64: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_MACOS == 'true' && secrets.APPLE_API_KEY_BASE64 || '' }}
  android:
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      sign_android: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_ANDROID == 'true' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_ANDROID == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_ANDROID == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_ANDROID == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ (github.event_name == 'push' || inputs.signed == true) && vars.SIGN_ANDROID == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    needs: [validate, checks, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified packages as a prerelease, never latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs
