name: Desktop installation packages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      sign_windows:
        type: boolean
        default: false
      sign_macos:
        type: boolean
        default: false
    secrets:
      WINDOWS_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: appimage,deb
            formats: AppImage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: nsis
            formats: exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-intel
            bundles: dmg
            formats: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-apple-silicon
            bundles: dmg
            formats: dmg
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse Windows integration test script before building
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nativeTokens = $null
          $nativeParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/release/verify-windows-associations.ps1'), [ref]$nativeTokens, [ref]$nativeParseErrors) | Out-Null
          if ($nativeParseErrors.Count) {
            foreach ($failure in $nativeParseErrors) { Write-Output ("::error title=Windows test script syntax::{0}" -f $failure.Message) }
            throw 'Windows integration test script has syntax errors'
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Linux package prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libfuse2 patchelf file desktop-file-utils xdg-utils
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: Default unsigned configuration
        run: node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/tauri-signing.json', '{}')"
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && inputs.sign_windows
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:CERTIFICATE -or !$env:CERTIFICATE_PASSWORD) { throw 'Windows signing secrets are missing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
            $certificates = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force) | Where-Object HasPrivateKey)
            if ($certificates.Count -ne 1) { throw 'Expected one signing certificate with a private key' }
            $cert = $certificates[0]
            @{bundle=@{windows=@{certificateThumbprint=$cert.Thumbprint;digestAlgorithm='sha256';timestampUrl='http://timestamp.digicert.com';tsp=$true}}} | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP 'tauri-signing.json')
          } finally { Remove-Item $pfx -ErrorAction SilentlyContinue }
      - name: Configure Apple signing and notarization
        if: runner.os == 'macOS' && inputs.sign_macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_BASE64; do
            [[ -n "${!key}" ]] || { echo "Missing $key"; exit 1; }
          done
          node scripts/release/apple-env.mjs
      - name: Build installation packages
        run: node scripts/release/run.mjs node node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/tauri-signing.json" -- --locked
      - name: Test native PDF storage and process locks
        run: node scripts/release/test-desktop-storage.mjs ${{ matrix.target }}
      - name: Test native PDF-open queue
        run: node scripts/release/test-pdf-open.mjs ${{ matrix.target }}
      - name: Verify actual Windows PDF registration without changing defaults
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/verify-windows-associations.ps1 -BundleRoot src-tauri/target/${{ matrix.target }}/release/bundle/nsis
      - name: Verify Linux packages and installed handler without changing defaults
        if: runner.os == 'Linux'
        run: python3 scripts/release/verify-associations.py linux src-tauri/target/${{ matrix.target }}/release/bundle
      - name: Verify actual macOS PDF association metadata
        if: runner.os == 'macOS'
        run: python3 scripts/release/verify-associations.py macos src-tauri/target/${{ matrix.target }}/release/bundle
      - name: Verify Windows signature
        if: runner.os == 'Windows' && inputs.sign_windows
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw 'Installer signature is not valid' }
          }
      - name: Verify notarization ticket
        if: runner.os == 'macOS' && inputs.sign_macos
        run: |
          for file in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do xcrun stapler validate "$file"; done
      - name: Collect packages and checksums
        env:
          PACKAGE_SIGNING: ${{ (runner.os == 'Windows' && inputs.sign_windows && 'authenticode') || (runner.os == 'macOS' && inputs.sign_macos && 'developer-id-notarized') || 'unsigned-or-ad-hoc' }}
        run: node scripts/release/collect.mjs src-tauri/target/${{ matrix.target }}/release/bundle ${{ matrix.label }} ${{ matrix.formats }}
      - name: Remove Apple key file
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.label }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
