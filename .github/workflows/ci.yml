name: Browser checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run poc
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Firefox layout, selection, clipboard and images
        run: npm run test:e2e -- tests/e2e/layout.spec.ts tests/e2e/selection.spec.ts tests/e2e/clipboard.spec.ts tests/e2e/images.spec.ts
        env:
          PLAYWRIGHT_BROWSER: firefox
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-firefox
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-preview-and-test-evidence
          path: |
            dist/
            artifacts/
            playwright-report/
            playwright-report-firefox/
          retention-days: 14
