[package]
name = "tauri-plugin-desktop-save"
version = "0.1.0"
description = "User-selected native PDF export with verified atomic file replacement"
authors = ["PDF Annotation Editor contributors"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-desktop-save"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
base64 = "=0.23.1"
uuid = { version = "=1.29.2", features = ["v4"] }
fs2 = "=0.4.3"
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3", "common-controls-v6"] }

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }
