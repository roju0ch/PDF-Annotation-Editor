[package]
name = "pdf-annotation-editor"
version = "0.1.0"
description = "Offline PDF viewer prototype"
authors = ["PDF Annotation Editor contributors"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pdf_annotation_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-window-tests = ["tauri-plugin-pdf-open/native-window-tests"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

tauri-plugin-android-bridge = { path = "plugins/tauri-plugin-android-bridge" }
tauri-plugin-pdf-open = { path = "plugins/tauri-plugin-pdf-open" }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-bridge = { path = "plugins/tauri-plugin-ios-bridge" }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.5" }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-desktop-save = { path = "plugins/tauri-plugin-desktop-save" }
